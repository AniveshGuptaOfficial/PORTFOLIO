        // Main App Component
        function App() {
            React.useEffect(() => {
                // Smooth scrolling for nav links
                document.querySelectorAll('a[href^="#"]').forEach(anchor => {
                    anchor.addEventListener('click', function(e) {
                        const target = document.querySelector(this.getAttribute('href'));
                        if (target) {
                            e.preventDefault();
                            target.scrollIntoView({ behavior: 'smooth' });
                        }
                    });
                });

                // Animate skill bars on scroll
                const animateSkills = () => {
                    document.querySelectorAll('.progress-fill').forEach(bar => {
                        const rect = bar.getBoundingClientRect();
                        if (rect.top <= window.innerHeight - 50) {
                            bar.style.width = bar.getAttribute('data-width');
                        }
                    });
                };

                document.querySelectorAll('.progress-fill').forEach(bar => {
                    bar.setAttribute('data-width', bar.style.width);
                    bar.style.width = '0%';
                });

                // Section reveal on scroll
                const revealSections = () => {
                    document.querySelectorAll('.section-reveal').forEach(section => {
                        const rect = section.getBoundingClientRect();
                        if (rect.top <= window.innerHeight * 0.88) {
                            section.classList.add('revealed');
                        }
                    });
                };

                // Sticky nav
                const nav = document.querySelector('.nav-container');
                const handleScroll = () => {
                    animateSkills();
                    revealSections();
                    if (window.scrollY > 60) {
                        nav.classList.add('nav-scrolled');
                    } else {
                        nav.classList.remove('nav-scrolled');
                    }
                };

                window.addEventListener('scroll', handleScroll);
                revealSections();

                // Certificate lightbox
                document.querySelectorAll('.certificate-card .cert-image-wrap img').forEach(img => {
                    img.addEventListener('click', () => {
                        const overlay = document.createElement('div');
                        overlay.className = 'lightbox-overlay';
                        const imgEl = document.createElement('img');
                        imgEl.src = img.src;
                        const close = document.createElement('button');
                        close.className = 'lightbox-close';
                        close.innerHTML = '&times;';
                        overlay.appendChild(imgEl);
                        overlay.appendChild(close);
                        document.body.appendChild(overlay);
                        const dismiss = () => document.body.removeChild(overlay);
                        overlay.addEventListener('click', (e) => { if (e.target === overlay) dismiss(); });
                        close.addEventListener('click', dismiss);
                    });
                });

                // Report PDF viewer
                document.querySelectorAll('.report-link').forEach(link => {
                    link.addEventListener('click', function(e) {
                        e.preventDefault();
                        const pdfPath = this.getAttribute('data-pdf');
                        const pdfFrame = document.getElementById('pdf-frame');
                        if (pdfPath && pdfPath !== '') {
                            pdfFrame.src = pdfPath;
                            pdfFrame.style.display = 'block';
                            document.querySelector('.pdf-viewer-container').scrollIntoView({ behavior: 'smooth' });
                        } else {
                            pdfFrame.style.display = 'none';
                            alert('PDF not available yet!');
                        }
                    });
                });

                document.getElementById('pdf-frame').style.display = 'none';

                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            return (
                <div>
                    <Header />
                    <Nav />
                    <About />
                    <Skills />
                    <Projects />
                    <Reports />
                    <Certificates />
                    <Resume />
                    <Contact />
                    <Footer />
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
